# Test on every supported OS, build once without publish credentials, then publish that same
# tarball using npm trusted publishing. The publishing job executes no dependency lifecycle
# scripts. Maintainers must configure npm's trusted publisher and protect release tags.
name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  package:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      version: ${{ steps.pack.outputs.version }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Pack and inspect the exact release artifact
        id: pack
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: node scripts/release-artifact.mjs "$RUNNER_TEMP/clauderipple-release"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        id: upload
        with:
          name: npm-release
          path: ${{ runner.temp }}/clauderipple-release/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: package
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      # Deliberately no checkout, npm install, build or repository script in the OIDC-enabled job.
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.package.outputs.artifact-id }}
          path: release
          merge-multiple: true
          digest-mismatch: error
      - name: Verify and publish the inspected tarball
        env:
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
          RELEASE_SHA256: ${{ needs.package.outputs.sha256 }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]
          [[ "$RELEASE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "v$RELEASE_VERSION" = "$GITHUB_REF_NAME"
          artifact="release/clauderipple-$RELEASE_VERSION.tgz"
          printf '%s  %s\n' "$RELEASE_SHA256" "$artifact" | sha256sum --check --strict -
          npm_version="$(npm --version)"
          NPM_VERSION="$npm_version" node -e 'const [a,b,c]=process.env.NPM_VERSION.split(".").map(Number); if(!(a>11 || (a===11 && (b>5 || (b===5 && c>=1))))) throw Error("npm 11.5.1+ is required for trusted publishing")'
          npm publish "$artifact" --registry=https://registry.npmjs.org --ignore-scripts --provenance --access public

  dry-run:
    needs: package
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.package.outputs.artifact-id }}
          path: release
          merge-multiple: true
          digest-mismatch: error
      - name: Dry-run the inspected tarball without publishing credentials
        env:
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
          RELEASE_SHA256: ${{ needs.package.outputs.sha256 }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]
          [[ "$RELEASE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          artifact="release/clauderipple-$RELEASE_VERSION.tgz"
          printf '%s  %s\n' "$RELEASE_SHA256" "$artifact" | sha256sum --check --strict -
          npm publish "$artifact" --registry=https://registry.npmjs.org --ignore-scripts --dry-run
