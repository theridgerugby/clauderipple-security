# Public AA metadata only. One orphan commit replaces the data branch on publication.
name: AA model data

on:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aa-data
  cancel-in-progress: false

jobs:
  dataset:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      publish: ${{ steps.compare.outputs.publish }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Read previous publication
        run: |
          if git ls-remote --exit-code --heads origin data > /dev/null; then
            git fetch origin data
            git show FETCH_HEAD:aa-models.json > "$RUNNER_TEMP/aa-previous.json"
            git show -s --format=%ct FETCH_HEAD > "$RUNNER_TEMP/aa-published-at"
          fi

      - name: Build dataset
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
        run: node scripts/aa-dataset.mjs --output "$RUNNER_TEMP/aa-models.json"

      - name: Compare content or weekly refresh
        id: compare
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { meaningfulContent, parseDataset } from './scripts/aa-dataset-lib.mjs';
          const dir = process.env.RUNNER_TEMP;
          const next = parseDataset(JSON.parse(fs.readFileSync(`${dir}/aa-models.json`, 'utf8')));
          const prev = fs.existsSync(`${dir}/aa-previous.json`) ? parseDataset(JSON.parse(fs.readFileSync(`${dir}/aa-previous.json`, 'utf8'))) : null;
          const published = fs.existsSync(`${dir}/aa-published-at`) ? Number(fs.readFileSync(`${dir}/aa-published-at`, 'utf8')) * 1000 : 0;
          const changed = meaningfulContent(next) !== meaningfulContent(prev);
          const weekly = Date.now() - published >= 7 * 86400000;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `publish=${changed || weekly}\n`);
          JS

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        id: upload
        if: steps.compare.outputs.publish == 'true'
        with:
          name: aa-model-data
          path: ${{ runner.temp }}/aa-models.json
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: dataset
    if: needs.dataset.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # This write-enabled job never checks out or executes the dataset fetcher's source and has
      # no AA API key. Its input is a data-only artifact from this same successful workflow run.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.dataset.outputs.artifact-id }}
          path: dataset
          merge-multiple: true
          digest-mismatch: error
      - name: Replace data branch with one commit
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          publication="$(mktemp -d "$RUNNER_TEMP/aa-publish.XXXXXX")"
          cp dataset/aa-models.json "$publication/aa-models.json"
          cd "$publication"
          git init -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aa-models.json
          git commit -m "data: refresh Artificial Analysis model scores" -m "Keep measured intelligence and USD cost per task current without growing dataset history." -m "Co-Authored-By: Claude Code <noreply@anthropic.com>"
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          authorization="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)"
          echo "::add-mask::$authorization"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $authorization" \
            git push --force origin HEAD:refs/heads/data
