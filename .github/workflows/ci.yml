# This personal fork currently supports Windows only. Run the full functional suite and
# native security gates for every candidate; this does not establish macOS/Linux acceptance.
#
# `pull_request` (not `pull_request_target`) runs a fork's code with a read-only token and no
# secrets, so nothing here may need one. The tests must keep to temporary homes: a runner is a
# throwaway VM, but the same tests may run next to the owner's live installation.
#
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  # The owner can request the same mandatory Windows gates without publishing.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, shard ${{ matrix.shard }}/4)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        # Native Windows DPAPI/ACL fixtures run much more slowly than on Unix.
        # Node's file-level test sharding keeps every test while bounding each runner.
        shard: [1, 2, 3, 4]
    env:
      # Dependency hooks remain disabled. Only the pinned Electron downloader below is invoked.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          package-manager-cache: false

      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
      - name: Fetch the pinned Electron runtime
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: ""
        run: node node_modules/electron/install.js
      - run: npm run typecheck
      # The mod's TSX needs Claude's engine types and its tests need a local Claude installation,
      # neither of which belongs in CI for a fork's code (G-D12). This parses the mod, resolves
      # its relative imports and checks the manifests; `claude plugin test packages/mod` stays a
      # maintainer step on a machine that has the engine.
      - run: npm run check:mod
      # TAP emits each failed assertion immediately, even if a later fixture hangs.
      # Node parses --test-shard only before positional test paths. Keep the test-file list
      # identical to test:ci; appending the flag through `npm run ... --` silently ran all files.
      # Run test files serially on each Windows VM: even two parallel files can exhaust
      # the native PowerShell ACL/DPAPI startup deadline under hosted runner contention.
      # Every file still runs on one of four independent shards; within-file tests still
      # exercise genuine eight-process credential races and fail-closed deadlines.
      - run: node --test --test-reporter=tap --test-concurrency=1 --test-shard=${{ matrix.shard }}/4 packages/router/test/*.test.ts packages/cli/test/*.test.ts test/mod/*.test.ts packages/remote/test/*.test.ts packages/app/test/*.test.ts
      - run: npm run build

  # Collect real desktop-boundary evidence even while a platform's full suite is
  # still running or has failed. Both job matrices remain mandatory release gates.
  native-security:
    name: native security (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Fetch the pinned Electron runtime
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: ""
        run: node node_modules/electron/install.js
      - run: npm run build
      - name: Native Windows Electron boundary tests
        run: npm run test:native --workspace @clauderipple/app
      - name: Native Windows ACL and control deadlines
        if: runner.os == 'Windows'
        # These also run in the full matrix. Keep a quick, real-Windows gate for fresh ACL
        # batches, caller cancellation, TLS generation races, phone proxying and shutdown receipts.
        run: node --test --test-reporter=tap packages/cli/test/bounded-exec.test.ts packages/router/test/private-file-batch.test.ts packages/router/test/windows-private-acl.test.ts packages/router/test/phone.test.ts packages/remote/test/local-control-deadline.test.ts packages/remote/test/local-transport.test.ts
      - name: Native Windows release and request regressions
        if: runner.os == 'Windows'
        # Keep full-file platform regressions visible before the larger suite finishes.
        run: node --test --test-reporter=tap packages/app/test/release-source.test.ts packages/router/test/chatgpt-sidecall-timeout.test.ts packages/router/test/proxy-requestlog.test.ts
      - name: Native Windows admin limits and HEAD regressions
        if: runner.os == 'Windows'
        # The full matrix still runs every admin test; isolate fresh and cached reading semantics.
        run: node --test --test-reporter=tap --test-name-pattern="GET /api/limits forecasts a window|GET /api/limits judges a cached reading|a config that failed validation is reported|HEAD answers a read-only route" packages/router/test/admin.test.ts
      - name: Native Windows personal sensitive-data gates
        if: runner.os == 'Windows'
        # Synthetic secrets only: real CurrentUser DPAPI, cross-process reads, native-app
        # config decoding, exact-origin refusal, clean PowerShell/Node startup, and verified
        # installation/recovery identity.
        run: node --test --test-reporter=tap packages/router/test/secret-storage.test.ts packages/app/test/config-secrets.test.ts packages/router/test/personal-policy.test.ts packages/router/test/personal-profile-smoke.test.ts packages/router/test/admin-personal-policy.test.ts packages/router/test/admin-credential-origin.test.ts packages/router/test/anthropic-local-auth.test.ts packages/cli/test/install-runtime.test.ts packages/cli/test/security-command.test.ts packages/cli/test/watchdog-port.test.ts packages/cli/test/personal-bootstrap.test.ts packages/cli/test/personal-windows-node-env.test.ts
      - name: Hosted Windows scheduled-task installation and rollback boundary
        if: runner.os == 'Windows'
        env:
          CLAUDERIPPLE_WINDOWS_SERVICE_ACCEPTANCE: "1"
        # Unique disposable task, synthetic DPAPI key and private client-settings path.
        # Never imports a CA into the Windows trust store or touches an installed Claude app.
        run: node --test --test-reporter=tap packages/cli/test/windows-personal-install.test.ts
      - name: Native Windows Desktop picker and subscription-preservation regressions
        if: runner.os == 'Windows'
        # Disposable local TLS endpoints and synthetic state only. These verify the native
        # runtime, not a real Claude Desktop account or the owner's current graphical build.
        # Every case also runs in the full four-shard suite.
        run: node --test --test-reporter=tap --test-concurrency=1 packages/cli/test/desktop-activation.test.ts packages/cli/test/desktop-config-preservation.test.ts packages/cli/test/desktop-install-settings.test.ts packages/router/test/desktop-policy.test.ts packages/router/test/desktop-runtime.test.ts packages/router/test/desktop-selection.test.ts packages/router/test/personal-google-desktop.test.ts packages/router/test/picker.test.ts packages/router/test/proxy-bootstrap.test.ts packages/router/test/proxy-desktop-transport.test.ts packages/router/test/ui-desktop-profile.test.ts
